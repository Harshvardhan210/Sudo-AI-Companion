<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cute Futuristic AI Robot</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

    /* --s converts "real screen pixels" to CSS pixels (Python sets it to 1 / zoom),
       so the notes card stays readable even though the robot window is tiny. */
    :root { --s: 3.125; }

    body.notes-open { padding-left: calc(var(--s) * 284px); }

    #notes-card {
      position: absolute;
      left: calc(var(--s) * 6px);
      top: 50%;
      transform: translateY(-50%);
      width: calc(var(--s) * 272px);
      max-height: calc(var(--s) * 420px);
      flex-direction: column;
      z-index: 15;
      border-radius: calc(var(--s) * 24px);
      padding: calc(var(--s) * 8px);
      border: calc(var(--s) * 1px) solid #ffffff;
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 1),
        inset 0 -4px 10px rgba(203, 213, 225, 0.6),
        0 calc(var(--s) * 8px) calc(var(--s) * 18px) calc(var(--s) * -8px) rgba(15, 23, 42, 0.45);
    }
    #notes-screen {
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-height: calc(var(--s) * 400px);
      border-radius: calc(var(--s) * 17px);
      border: calc(var(--s) * 1px) solid rgba(30, 41, 59, 0.8);
      padding: calc(var(--s) * 12px) calc(var(--s) * 14px);
      color: #e0f2fe;
      font-size: calc(var(--s) * 13.5px);
      line-height: 1.35;
    }
    .notes-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: calc(var(--s) * 6px);
      font-size: calc(var(--s) * 11px); font-weight: 700; letter-spacing: 0.22em;
      color: rgba(125, 211, 252, 0.85);
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    .notes-head .notes-count { letter-spacing: 0.05em; }
    #notes-close {
      cursor: pointer; margin-left: calc(var(--s) * 8px);
      width: calc(var(--s) * 20px); height: calc(var(--s) * 20px);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: rgba(186, 230, 253, 0.8); background: rgba(56, 189, 248, 0.15);
      font-size: calc(var(--s) * 11px); line-height: 1;
    }
    #notes-close:hover { background: rgba(244, 63, 94, 0.35); color: #fff; }
    #notes-body { overflow-y: auto; min-height: 0; }
    #notes-body::-webkit-scrollbar { width: calc(var(--s) * 5px); }
    #notes-body::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 999px; }
    .notes-section {
      margin: calc(var(--s) * 10px) 0 calc(var(--s) * 2px);
      font-size: calc(var(--s) * 10.5px); letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(125, 211, 252, 0.6);
    }
    .notes-section:first-child { margin-top: 0; }
    .notes-section .live { color: #38bdf8; }
    .note-item { display: flex; gap: calc(var(--s) * 8px); margin: calc(var(--s) * 5px) 0; }
    .note-num {
      flex: none; width: calc(var(--s) * 20px); height: calc(var(--s) * 20px); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(56, 189, 248, 0.18); color: #7dd3fc; font-weight: 700;
      font-size: calc(var(--s) * 11px);
    }
    .note-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .todo-item { display: flex; gap: calc(var(--s) * 9px); margin: calc(var(--s) * 6px) 0; cursor: pointer; align-items: flex-start; }
    .todo-box {
      flex: none; width: calc(var(--s) * 18px); height: calc(var(--s) * 18px); border-radius: 50%;
      margin-top: calc(var(--s) * 1px);
      border: calc(var(--s) * 1.5px) solid rgba(125, 211, 252, 0.75);
      display: flex; align-items: center; justify-content: center;
      font-size: calc(var(--s) * 11px); font-weight: 800; color: transparent;
    }
    .todo-item:hover .todo-box { background: rgba(56, 189, 248, 0.2); }
    .todo-item.done .todo-box { background: #38bdf8; border-color: #38bdf8; color: #0b1220; box-shadow: 0 0 calc(var(--s) * 8px) rgba(56, 189, 248, 0.7); }
    .todo-item.done .note-text { text-decoration: line-through; opacity: 0.5; }
    .notes-empty { color: rgba(186, 230, 253, 0.55); font-style: italic; margin: calc(var(--s) * 4px) 0; }
    #text-input {
      caret-color: #38bdf8;
      color: #e0f2fe;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.55);
    }
    #text-input::placeholder {
      color: rgba(125, 211, 252, 0.45);
      text-shadow: none;
    }
    #text-reply::-webkit-scrollbar { width: 6px; }
    #text-reply::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 999px; }
    body.text-mode #btn-close {
      width: 28px !important;
      height: 28px !important;
      font-size: 14px !important;
    }
    html, body {
      background: transparent !important;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Ambient background grid & glow - Light Theme */
    .cyber-grid {
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.12) 1px, transparent 1px);
    }

    /* Floating head animation */
    @keyframes floatHead {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-10px) rotate(0.6deg);
      }
    }

    /* Front Paws / Floating hands resting in front */
    @keyframes floatPawLeft {
      0%, 100% {
        transform: translateY(0px) rotate(-3deg);
      }
      50% {
        transform: translateY(-6px) rotate(-1deg);
      }
    }

    @keyframes floatPawRight {
      0%, 100% {
        transform: translateY(-1px) rotate(3deg);
      }
      50% {
        transform: translateY(-7px) rotate(1deg);
      }
    }

    /* Soft shadow pulsing under character */
    @keyframes shadowPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.22;
      }
      50% {
        transform: scale(0.85);
        opacity: 0.12;
      }
    }

    /* Ambient Aura Glow */
    @keyframes auraGlow {
      0%, 100% {
        opacity: 0.65;
        transform: scale(0.96);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.06);
      }
    }

    /* Rapid Alternate Paw Typing Animation */
    @keyframes rapidTypePawLeft {
      0%, 100% {
        transform: translateY(8px) translateX(6px) rotate(-4deg) scale(0.96);
      }
      25% {
        transform: translateY(17px) translateX(8px) rotate(-8deg) scale(1.03);
      }
      50% {
        transform: translateY(7px) translateX(5px) rotate(-3deg) scale(0.97);
      }
      75% {
        transform: translateY(11px) translateX(7px) rotate(-6deg) scale(1);
      }
    }

    @keyframes rapidTypePawRight {
      0%, 100% {
        transform: translateY(6px) translateX(-5px) rotate(3deg) scale(0.97);
      }
      25% {
        transform: translateY(10px) translateX(-7px) rotate(5deg) scale(1);
      }
      50% {
        transform: translateY(18px) translateX(-9px) rotate(9deg) scale(1.04);
      }
      75% {
        transform: translateY(8px) translateX(-6px) rotate(4deg) scale(0.96);
      }
    }

    /* Holographic Keyboard Float & Key Ripple Animation */
    @keyframes holoFloat {
      0%, 100% {
        transform: translateY(0px) rotateX(24deg) scale(1);
      }
      50% {
        transform: translateY(-3px) rotateX(22deg) scale(1.02);
      }
    }

    @keyframes sparkFloat1 {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-16px) translateX(-6px) scale(0);
        opacity: 0;
      }
    }

    @keyframes sparkFloat2 {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-16px) translateX(6px) scale(0);
        opacity: 0;
      }
    }

    /* Thought Cloud Floating & Pulse */
    @keyframes thoughtFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-6px) scale(1.02);
      }
    }

    /* Soundwave / waveform line oscillation */
    @keyframes soundWave {
      0%, 100% {
        height: 6px;
      }
      50% {
        height: 20px;
      }
    }

    /* ECG / Data Line scanning effect */
    @keyframes dataPulseLine {
      0% {
        stroke-dashoffset: 240;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    /* Listening Pulsing Waves for Mic button */
    @keyframes pulseRing {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.3);
        opacity: 0;
      }
      100% {
        transform: scale(0.95);
        opacity: 0;
      }
    }

    .mic-active-ring {
      animation: pulseRing 1.6s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    .animate-float-head {
      animation: floatHead 4.4s ease-in-out infinite;
    }

    .animate-paw-left {
      animation: floatPawLeft 3.6s ease-in-out infinite;
    }

    .animate-paw-right {
      animation: floatPawRight 3.8s ease-in-out infinite;
    }

    .animate-shadow {
      animation: shadowPulse 4.4s ease-in-out infinite;
    }

    .animate-aura {
      animation: auraGlow 4s ease-in-out infinite;
    }

    /* Searching Specific Active Classes */
    .animate-typing-paw-l {
      animation: rapidTypePawLeft 0.26s cubic-bezier(0.4, 0, 0.2, 1) infinite !important;
    }

    .animate-typing-paw-r {
      animation: rapidTypePawRight 0.26s cubic-bezier(0.4, 0, 0.2, 1) infinite !important;
    }

    .animate-holo-keyboard {
      animation: holoFloat 2.6s ease-in-out infinite;
    }

    .animate-spark-left {
      animation: sparkFloat1 0.35s ease-out infinite;
    }

    .animate-spark-right {
      animation: sparkFloat2 0.35s ease-out infinite 0.17s;
    }

    .animate-thought-bubble {
      animation: thoughtFloat 3.2s ease-in-out infinite;
    }

    /* Deadpan Serious Face (😑 style flat bars) */
    .deadpan-eye-bar {
      width: 44px !important;
      height: 7px !important;
      border-radius: 9999px !important;
      background: #38bdf8 !important;
      box-shadow: 0 0 14px #38bdf8, 0 0 24px rgba(6, 182, 212, 0.9), inset 0 0 6px #ffffff !important;
      transform: none !important;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Ceramic chassis & screen styling */
    .ceramic-chassis {
      background: linear-gradient(145deg, #ffffff 0%, #f8fafc 45%, #e2e8f0 100%);
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 1),
        inset 0 -4px 10px rgba(203, 213, 225, 0.6);
    }

    .visor-glass {
      background: radial-gradient(circle at 50% 25%, #0f172a 0%, #020617 92%);
      box-shadow: 
        inset 0 2px 6px rgba(255, 255, 255, 0.14),
        inset 0 -6px 20px rgba(0, 0, 0, 0.95);
    }

    .eye-glow {
      box-shadow: 0 0 18px #38bdf8, 0 0 35px rgba(56, 189, 248, 0.8), inset 0 0 8px #ffffff;
    }

    .happy-eye {
      border-radius: 50px 50px 0 0 !important;
      height: 20px !important;
      border-top: 6px solid #67e8f9 !important;
      border-left: 6px solid #67e8f9 !important;
      border-right: 6px solid #67e8f9 !important;
      background: transparent !important;
      box-shadow: 0 -4px 18px rgba(56, 189, 248, 0.9) !important;
    }

    .cheek-glow {
      box-shadow: 0 0 14px rgba(244, 114, 182, 0.65);
    }

    .paw-ceramic {
      background: linear-gradient(145deg, #ffffff 0%, #f8fafc 50%, #e2e8f0 100%);
      box-shadow: 
        0 12px 24px -4px rgba(15, 23, 42, 0.18),
        0 0 14px rgba(56, 189, 248, 0.2),
        inset 0 2px 3px rgba(255, 255, 255, 1),
        inset 0 -2px 6px rgba(203, 213, 225, 0.5);
    }

    /* Action buttons frosted look */
    .action-btn-glass {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 250, 252, 0.85) 100%);
      box-shadow: 
        0 8px 20px -4px rgba(15, 23, 42, 0.12),
        0 2px 6px -1px rgba(14, 165, 233, 0.08),
        inset 0 1.5px 2px rgba(255, 255, 255, 1),
        inset 0 -1.5px 3px rgba(203, 213, 225, 0.4);
    }

    /* Holographic keyboard styling */
    .holo-deck {
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.18) 0%, rgba(14, 165, 233, 0.08) 100%);
      box-shadow: 0 10px 25px -3px rgba(6, 182, 212, 0.35), inset 0 0 12px rgba(56, 189, 248, 0.45);
      perspective: 600px;
    }

    /* Thought Cloud Styling */
    .thought-bubble-glass {
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 
        0 14px 35px -5px rgba(6, 182, 212, 0.22),
        0 4px 12px rgba(15, 23, 42, 0.08),
        inset 0 2px 4px rgba(255, 255, 255, 1),
        0 0 18px rgba(56, 189, 248, 0.25);
    }

    .waveform-bar {
      animation: soundWave 0.9s ease-in-out infinite alternate;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col items-center justify-between p-4 overflow-hidden relative select-none">
<!-- Minimal Header -->
<header class="absolute top-1 right-1 flex items-center justify-end z-20 cursor-move" id="app-header" title="Drag to move">
<div class="flex items-center gap-1.5">
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/75 border border-slate-200/80 shadow-sm transition-all duration-300" id="status-pill" style="display:none">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" id="status-indicator"></span>
<span class="text-[11px] font-semibold text-slate-700" id="status-label">ONLINE</span>
</div>
<button aria-label="Close assistant" title="Close" class="cursor-pointer w-12 h-12 rounded-full bg-white/90 border border-slate-200/80 shadow-sm flex items-center justify-center text-slate-600 text-2xl font-bold leading-none hover:text-rose-500 hover:border-rose-200 transition-colors" id="btn-close" onclick="closeAssistantWindow(event)">&#10005;</button>
</div>
</header>
<!-- Interactive Robot Area -->
<main class="w-full flex-1 flex flex-col items-center justify-center relative z-10 cursor-pointer py-4" id="robot-interactive-zone" title="Tap or click me!">
<!-- Combined Robot Container -->
<div class="relative flex items-center justify-center">
<!-- Futuristic Thought Cloud (Active during Searching Mode) -->
<div class="absolute -top-24 -right-16 md:-right-24 z-40 pointer-events-none transition-all duration-400 ease-out opacity-0 scale-75 translate-y-3" id="thought-cloud-wrapper">
<div class="relative animate-thought-bubble">
<!-- Main Thought Cloud Body -->
<div class="thought-bubble-glass rounded-[28px] border border-cyan-300/60 px-4 py-2.5 flex flex-col items-center gap-1.5 shadow-[0_8px_30px_rgba(56,189,248,0.25)] min-w-[150px]">
<!-- Header Badge -->
<div class="flex items-center justify-between w-full gap-2 border-b border-cyan-100 pb-1 text-[9px] font-semibold text-cyan-600 tracking-wider">
<span class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
          PROCESSING
        </span>
<span class="text-[8px] font-mono text-cyan-500">100% CPU</span>
</div>
<!-- Processing Waveform & Line Animation -->
<div class="flex items-center justify-center gap-1 h-6 w-full px-1">
<span class="waveform-bar w-1 rounded-full bg-cyan-400" style="animation-delay: 0.0s;"></span>
<span class="waveform-bar w-1 rounded-full bg-cyan-500" style="animation-delay: 0.15s;"></span>
<span class="waveform-bar w-1 rounded-full bg-sky-400" style="animation-delay: 0.3s;"></span>
<span class="waveform-bar w-1 rounded-full bg-cyan-400" style="animation-delay: 0.45s;"></span>
<span class="waveform-bar w-1.5 rounded-full bg-cyan-500" style="animation-delay: 0.6s;"></span>
<span class="waveform-bar w-1 rounded-full bg-sky-400" style="animation-delay: 0.2s;"></span>
<span class="waveform-bar w-1 rounded-full bg-cyan-400" style="animation-delay: 0.4s;"></span>
<span class="waveform-bar w-1 rounded-full bg-cyan-500" style="animation-delay: 0.1s;"></span>
<span class="waveform-bar w-1 rounded-full bg-sky-400" style="animation-delay: 0.5s;"></span>
</div>
<!-- Scanning SVG Frequency / Data Line -->
<div class="w-full flex items-center justify-center overflow-hidden h-3">
<svg class="w-full h-full stroke-cyan-500 fill-none" viewbox="0 0 100 12">
<path d="M0,6 L20,6 L27,2 L34,10 L42,1 L50,11 L58,4 L64,8 L72,6 L100,6" stroke-dasharray="100" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" style="animation: dataPulseLine 1.4s linear infinite;"></path>
</svg>
</div>
</div>
<!-- Thought Bubble Connector Nodes -->
<div class="absolute -bottom-2.5 left-4 w-4 h-4 rounded-full thought-bubble-glass border border-cyan-300/70 shadow-sm"></div>
<div class="absolute -bottom-5 left-1 w-2.5 h-2.5 rounded-full thought-bubble-glass border border-cyan-300/70 shadow-sm"></div>
</div>
</div>
<!-- Main Robot Head -->
<div class="animate-float-head transition-transform duration-300 ease-out z-10 relative" id="robot-head">
<!-- Clean Sleek Rounded Outer Ceramic Casing -->
<div class="relative w-64 h-60 rounded-[52px] p-3.5 ceramic-chassis border border-white flex items-center justify-center">
<!-- Outer Surface Gloss Curve -->
<div class="absolute top-2 left-8 right-8 h-4 bg-gradient-to-b from-white to-transparent rounded-full pointer-events-none blur-[0.5px]"></div>
<!-- Top Mini Antenna Bead -->
<div class="absolute -top-2 left-1/2 -translate-x-1/2 w-5 h-2.5 rounded-full bg-white border border-slate-200 shadow-[0_2px_6px_rgba(15,23,42,0.1),0_0_8px_rgba(56,189,248,0.6)] flex items-center justify-center">
<div class="w-2.5 h-1 bg-cyan-400 rounded-full animate-pulse" id="antenna-light"></div>
</div>

<!-- Visor Diagonal Sheen -->

<!-- Reminder countdown screen: covers the face while a reminder is active -->

<!-- Left Eye -->

<div class="pupil w-5 h-7 rounded-full bg-white flex items-center justify-center shadow-[0_0_10px_#ffffff] transition-transform duration-300">

</div>

</div>
<!-- Right Eye -->

<div class="pupil w-5 h-7 rounded-full bg-white flex items-center justify-center shadow-[0_0_10px_#ffffff] transition-transform duration-300">
<div class="w-2.5 h-3.5 rounded-full bg-sky-200"></div>
</div>
<div class="absolute top-1.5 right-2 w-2 h-2 rounded-full bg-white/95"></div>
</div>
</div>
<!-- Cute Blushing Cheeks -->
<div class="w-full flex justify-between px-3 -mt-2 opacity-30 transition-opacity duration-300 pointer-events-none" id="blush-layer">
<div class="w-6 h-2 rounded-full bg-pink-400 cheek-glow blur-[2px]"></div>
<div class="w-6 h-2 rounded-full bg-pink-400 cheek-glow blur-[2px]"></div>
</div>
<!-- Expressive Animated Mouth -->
<div class="h-5 flex items-center justify-center relative w-full mb-2">
<div class="w-5 h-2 rounded-full bg-cyan-300/90 shadow-[0_0_10px_#38bdf8] transition-all duration-200 ease-out" id="robot-mouth"></div>
</div>
</div>
</div>
</div>

<!-- Connect JavaScript to Python -->
<script>
    let assistantBridge = null;
    let bridgeReady = false;
    let windowController = null;

    // Connect to a Python signal without letting one failure break the rest.
    function safeConnect(signalName, handler) {
        try {
            if (!assistantBridge || !assistantBridge[signalName]) {
                console.error("Python signal missing: " + signalName +
                              " - is gui/assistant_bridge.py the latest version?");
                return;
            }
            assistantBridge[signalName].connect(handler);
        } catch (e) {
            console.error("Could not connect signal " + signalName, e);
        }
    }

    function connectPythonBridge() {
        if (typeof QWebChannel === "undefined") {
            console.error("QWebChannel is not available.");
            return;
        }

        if (typeof qt === "undefined" || !qt.webChannelTransport) {
            console.error("Qt WebChannel transport is unavailable.");
            return;
        }

        new QWebChannel(qt.webChannelTransport, function(channel) {
            assistantBridge = channel.objects.assistantBridge;
            windowController = channel.objects.windowController || null;
            bridgeReady = true;

            console.log("Python bridge connected successfully.");

            // Python status changes (e.g. "Searching...", "Opening Chrome", "Idle")
            assistantBridge.statusChanged.connect(function(status) {
                console.log("Python status:", status);
                handleBridgeStatus(status);
            });

            // Assistant finished and replied -> task is done
            assistantBridge.assistantResponse.connect(function(response) {
                console.log("Assistant response:", response);
                handleBridgeResponse(response);
            });

            // A voice/text command was understood -> task is starting
            assistantBridge.commandRecognized.connect(function(command) {
                console.log("Recognized command:", command);
                handleBridgeCommand(command);
            });

            // Reminders: countdown list, time-is-up alert, finished speaking
            safeConnect("remindersChanged", function(json) { handleRemindersChanged(json); });
            safeConnect("reminderDue",      function(name) { handleReminderDue(name); });
            safeConnect("reminderDone",     function(name) { handleReminderDone(name); });

            safeConnect("notesChanged", function(json) { handleNotesChanged(json); });
            safeConnect("todoChanged",  function(json) { handleTodoChanged(json); });

            try {
                assistantBridge.requestTodo();
            } catch (e) {
                console.error("requestTodo failed - is gui/assistant_bridge.py the latest version?", e);
            }

            try {
                assistantBridge.requestNotes();
            } catch (e) {
                console.error("requestNotes failed - is gui/assistant_bridge.py the latest version?", e);
            }

            try {
                assistantBridge.requestReminders();
            } catch (e) {
                console.error("requestReminders failed - is gui/assistant_bridge.py the latest version?", e);
            }
        });
    }

    connectPythonBridge();
</script>

<!-- Animation & Interaction Engine -->
<script>
    const leftEye = document.getElementById('left-eye');
    const rightEye = document.getElementById('right-eye');
    const eyesContainer = document.getElementById('eyes-container');
    const mouth = document.getElementById('robot-mouth');
    const leftHand = document.getElementById('left-hand');
    const rightHand = document.getElementById('right-hand');
    const robotHead = document.getElementById('robot-head');
    const blush = document.getElementById('blush-layer');
    const hintText = document.getElementById('hint-text');
    const hintIcon = document.getElementById('hint-icon');
    const interactiveZone = document.getElementById('robot-interactive-zone');
    const holoKeyboard = document.getElementById('holo-keyboard-container');
    const thoughtCloud = document.getElementById('thought-cloud-wrapper');
    const statusPill = document.getElementById('status-pill');
    const statusIndicator = document.getElementById('status-indicator');
    const statusLabel = document.getElementById('status-label');
    const antennaLight = document.getElementById('antenna-light');

    // New action button elements
    const btnMic = document.getElementById('btn-mic');
    const micPulseRing = document.getElementById('mic-pulse-ring');
    const micStatusDot = document.getElementById('mic-status-dot');
    const micLabel = document.getElementById('mic-label');
    const micIcon = document.getElementById('mic-icon');
    const btnStop = document.getElementById('btn-stop');

    let isInteracting = false;
    let currentEmotion = 'neutral';
    let isListening = false;
    let continuousListening = false;   // true from Mic click until Stop is pressed
    let listeningWaveInterval = null;
    let searchScanInterval = null;
    let keyGlitchInterval = null;

    // Blinking mechanism
    function triggerBlink() {
      if (isInteracting && (currentEmotion === 'happy' || currentEmotion === 'love' || currentEmotion === 'searching')) return;
      
      leftEye.style.transform = 'scaleY(0.08)';
      rightEye.style.transform = 'scaleY(0.08)';
      
      setTimeout(() => {
        if (currentEmotion !== 'searching') {
          leftEye.style.transform = 'scaleY(1)';
          rightEye.style.transform = 'scaleY(1)';
        }
      }, 160);
    }

    // Schedule natural random blinking
    function scheduleBlink() {
      const nextBlink = Math.random() * 3200 + 2200;
      setTimeout(() => {
        triggerBlink();
        scheduleBlink();
      }, nextBlink);
    }
    scheduleBlink();

    // Looking left, right, and center naturally
    function scheduleLooking() {
      const nextLook = Math.random() * 4000 + 2500;
      setTimeout(() => {
        if (!isInteracting && currentEmotion !== 'searching' && !isListening) {
          const rand = Math.random();
          const pupils = document.querySelectorAll('.pupil');
          
          if (rand < 0.35) {
            // Look left
            eyesContainer.style.transform = 'translateX(-7px)';
            pupils.forEach(p => p.style.transform = 'translateX(-4px)');
            mouth.style.transform = 'translateX(-3px)';
          } else if (rand < 0.70) {
            // Look right
            eyesContainer.style.transform = 'translateX(7px)';
            pupils.forEach(p => p.style.transform = 'translateX(4px)');
            mouth.style.transform = 'translateX(3px)';
          } else {
            // Center
            eyesContainer.style.transform = 'translateX(0px)';
            pupils.forEach(p => p.style.transform = 'translateX(0px)');
            mouth.style.transform = 'translateX(0px)';
          }
        }
        scheduleLooking();
      }, nextLook);
    }
    scheduleLooking();

    // Reset Eyes to Default glowing circles
    function resetEyes() {
      eyesContainer.style.transform = 'translateX(0px)';
      
      leftEye.className = "w-12 h-[60px] rounded-full bg-cyan-400 eye-glow flex items-center justify-center relative transition-all duration-200 overflow-hidden";
      rightEye.className = "w-12 h-[60px] rounded-full bg-cyan-400 eye-glow flex items-center justify-center relative transition-all duration-200 overflow-hidden";
      leftEye.style.width = "";
      leftEye.style.height = "";
      rightEye.style.width = "";
      rightEye.style.height = "";
      leftEye.style.borderRadius = "";
      rightEye.style.borderRadius = "";
      leftEye.style.transform = '';
      rightEye.style.transform = '';
      leftEye.style.boxShadow = '';
      rightEye.style.boxShadow = '';
      leftEye.style.background = '';
      rightEye.style.background = '';

      leftEye.innerHTML = `
        <div class="pupil w-5 h-7 rounded-full bg-white flex items-center justify-center shadow-[0_0_10px_#ffffff] transition-transform duration-300">
          <div class="w-2.5 h-3.5 rounded-full bg-sky-200"></div>
        </div>
        <div class="absolute top-1.5 right-2 w-2 h-2 rounded-full bg-white/95"></div>`;
      rightEye.innerHTML = `
        <div class="pupil w-5 h-7 rounded-full bg-white flex items-center justify-center shadow-[0_0_10px_#ffffff] transition-transform duration-300">
          <div class="w-2.5 h-3.5 rounded-full bg-sky-200"></div>
        </div>
        <div class="absolute top-1.5 right-2 w-2 h-2 rounded-full bg-white/95"></div>`;
    }

    function clearSearchingEffects() {
      if (searchScanInterval) {
        clearInterval(searchScanInterval);
        searchScanInterval = null;
      }
      if (keyGlitchInterval) {
        clearInterval(keyGlitchInterval);
        keyGlitchInterval = null;
      }

      // Hide holographic keyboard smoothly
      holoKeyboard.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
      holoKeyboard.classList.add('opacity-0', 'scale-75', 'translate-y-3');

      // Hide thought cloud smoothly
      if (thoughtCloud) {
        thoughtCloud.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
        thoughtCloud.classList.add('opacity-0', 'scale-75', 'translate-y-3');
      }

      // Stop typing paw animation and restore resting float
      leftHand.classList.remove('animate-typing-paw-l');
      rightHand.classList.remove('animate-typing-paw-r');
      leftHand.classList.add('animate-paw-left');
      rightHand.classList.add('animate-paw-right');
      leftHand.style.transform = '';
      rightHand.style.transform = '';

      // Reset antenna light and status pill
      antennaLight.classList.remove('!bg-amber-400');
      statusIndicator.className = "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse";
      statusLabel.textContent = "ONLINE";
      statusPill.classList.remove('!border-cyan-400/80', '!bg-cyan-50/90');
    }

    function deactivateListeningMode() {
      if (!isListening) return;
      isListening = false;
      if (listeningWaveInterval) {
        clearInterval(listeningWaveInterval);
        listeningWaveInterval = null;
      }
      micPulseRing.classList.remove('mic-active-ring', '!opacity-100');
      micPulseRing.classList.add('opacity-0');
      micStatusDot.classList.remove('!opacity-100');
      micStatusDot.classList.add('opacity-0');
      btnMic.classList.remove('!border-cyan-400', '!text-cyan-600', '!bg-cyan-50/80', 'shadow-[0_0_18px_rgba(6,182,212,0.4)]');
      micLabel.textContent = "Mic";
      micLabel.classList.remove('!text-cyan-600', 'font-bold');
      antennaLight.classList.remove('!bg-cyan-300');
    }

    // Toggle Voice Listening Mode via Mic Button
    function toggleListeningMode(event) {
    if (event) event.stopPropagation();

    // Already listening continuously: only the Stop button turns it off.
    if (continuousListening) return;

    // Do not activate the visual animation if Python is disconnected.
    if (!bridgeReady || !assistantBridge) {
        console.error("Python bridge is not connected.");

        hintIcon.textContent = "⚠️";
        hintText.textContent = "Python connection unavailable.";

        return;
    }

    // Start Python continuous listening (wake word: "sudo").
    assistantBridge.startListening();
    continuousListening = true;
    activateListeningVisuals();
}

// Shows the "listening" look (also restored after each command finishes).
function activateListeningVisuals() {
    // Stop other animations first.
    clearTimeout(window.emotionTimeout);
    clearSearchingEffects();

    isListening = true;
    isInteracting = true;
    currentEmotion = 'listening';

    // Update Mic button style.
    micPulseRing.classList.remove('opacity-0');
    micPulseRing.classList.add('mic-active-ring', '!opacity-100');

    micStatusDot.classList.remove('opacity-0');
    micStatusDot.classList.add('!opacity-100');

    btnMic.classList.add(
        '!border-cyan-400',
        '!text-cyan-600',
        '!bg-cyan-50/80',
        'shadow-[0_0_18px_rgba(6,182,212,0.4)]'
    );

    micLabel.textContent = "Listening...";
    micLabel.classList.add('!text-cyan-600', 'font-bold');

    // Update status pill.
    statusIndicator.className =
        "w-2 h-2 rounded-full bg-cyan-400 animate-ping";

    statusLabel.textContent = "LISTENING";
    statusPill.classList.add(
        '!border-cyan-400/80',
        '!bg-cyan-50/90'
    );

    antennaLight.classList.add('!bg-cyan-300');


    // Listening eyes.
    resetEyes();

    leftEye.style.transform = 'scale(1.08)';
    rightEye.style.transform = 'scale(1.08)';

    // Animated mouth.
    mouth.style.width = "14px";
    mouth.style.height = "14px";
    mouth.style.borderRadius = "9999px";
    mouth.style.background = "#38bdf8";
    mouth.style.boxShadow = "0 0 14px #38bdf8";

    // Hands.
    leftHand.style.transform =
        "translateY(-8px) translateX(6px) rotate(-12deg)";

    rightHand.style.transform =
        "translateY(-8px) translateX(-6px) rotate(12deg)";

    blush.style.opacity = "0.5";

    hintIcon.textContent = "🎙️";
    hintText.textContent = "I'm listening closely... speak now!";

    // Listening animation.
    let pulseStep = 0;

    listeningWaveInterval = setInterval(() => {

    // Stop button handler: cancels listening, search typing, or active emotion and returns to neutral

    deactivateListeningMode();
    clearSearchingEffects();

}

    // Emotion controller

        antennaLight.classList.add('!bg-amber-400');

        const searchPhrases = [
          "Deep thought mode active: crunching data matrices...",

        ];

        searchScanInterval = setInterval(() => {
          if (currentTaskText) {

          hintText.textContent = searchPhrases[phraseIdx];

      } else if (type === 'love') {
        // Heart-like glowing pink-tinted eyes
        leftEye.className = "w-12 happy-eye transition-all duration-200 !border-pink-400 !shadow-[0_-4px_16px_rgba(244,114,182,0.9)]";
        rightEye.className = "w-12 happy-eye transition-all duration-200 !border-pink-400 !shadow-[0_-4px_16px_rgba(244,114,182,0.9)]";
        leftEye.innerHTML = "";
        rightEye.innerHTML = "";

        mouth.style.height = "11px";
        mouth.style.borderRadius = "2px 2px 14px 14px";
        mouth.style.background = "#f472b6";

        // Paws hold close together in front like cute paws hugging chin
        leftHand.style.transform = "translateY(-16px) translateX(12px) rotate(8deg) scale(1.05)";
        rightHand.style.transform = "translateY(-16px) translateX(-12px) rotate(-8deg) scale(1.05)";
        hintIcon.textContent = "❤️";
        hintText.textContent = "AI loves company! ❤️";
      }

      // Auto revert to calm neutral after 4 seconds for wink/curious/love/happy (searching stays active until stopped or toggled)
      if (type !== 'searching') {

          returnToCalm();
        }, 4000);
      }
    }

    function returnToCalm() {
      clearSearchingEffects();
      deactivateListeningMode();
      resetEyes();

      mouth.style.width = "20px";
      mouth.style.height = "8px";
      mouth.style.borderRadius = "9999px";
      mouth.style.background = "#67e8f9";
      mouth.style.transform = "none";
      mouth.style.boxShadow = "0 0 10px #38bdf8";
      blush.style.opacity = "0.3";
      
      leftHand.style.transform = "";
      rightHand.style.transform = "";
      robotHead.style.transform = "";
      
      isInteracting = false;
      currentEmotion = 'neutral';
      hintIcon.textContent = "✨";
      hintText.textContent = "Tap anywhere to play with me!";

      currentTaskText = '';
      currentTaskLabel = '';
    }

    // Direct click/tap on robot triggers excited happy wave & cheerful paw gesture
    interactiveZone.addEventListener('click', (e) => {
      // Ignore if clicking action buttons container
      if (e.target.closest('#btn-mic') || e.target.closest('#btn-stop')) return;
      // Ignore the click that ends a window drag
      if (dragMoved) { dragMoved = false; return; }

      if (currentEmotion === 'searching') {
        // Quick burst typing feedback on keyboard tap
        const spark = document.createElement('div');
        spark.className = 'absolute pointer-events-none text-cyan-600 font-bold text-xs animate-bounce z-40 bg-white/95 px-3 py-1 rounded-full shadow-md border border-cyan-300 flex items-center gap-1';
        spark.innerHTML = '<span>⚡ Code Executed!</span>';
        const rect = interactiveZone.getBoundingClientRect();
        spark.style.left = `${e.clientX - rect.left}px`;
        spark.style.top = `${e.clientY - rect.top}px`;
        interactiveZone.appendChild(spark);
        setTimeout(() => spark.remove(), 1200);
        return;
      }

      if (isListening) {
        // Audio recognized pulse
        const spark = document.createElement('div');
        spark.className = 'absolute pointer-events-none text-cyan-600 font-bold text-xs animate-bounce z-40 bg-white/95 px-3 py-1 rounded-full shadow-md border border-cyan-300 flex items-center gap-1';
        spark.innerHTML = '<span>🎙️ Voice captured!</span>';
        const rect = interactiveZone.getBoundingClientRect();
        spark.style.left = `${e.clientX - rect.left}px`;
        spark.style.top = `${e.clientY - rect.top}px`;
        interactiveZone.appendChild(spark);
        setTimeout(() => spark.remove(), 1200);
        return;
      }

      triggerRandomEmotion();

      const rect = interactiveZone.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const spark = document.createElement('div');
      spark.className = 'absolute pointer-events-none text-cyan-600 font-bold text-sm animate-bounce z-40 bg-white/90 px-2.5 py-1 rounded-full shadow-md border border-cyan-200';
      spark.style.left = `${x}px`;
      spark.style.top = `${y}px`;
      spark.textContent = '✨ Beep Boop!';
      interactiveZone.appendChild(spark);

      setTimeout(() => spark.remove(), 1100);
    });

    // Touch/Mouse movement tracking - robot eyes softly follow pointer
    window.addEventListener('mousemove', (e) => {
      if (isInteracting && currentEmotion !== 'neutral' && currentEmotion !== 'searching') return;

      const { innerWidth, innerHeight } = window;
      const xRatio = (e.clientX / innerWidth - 0.5) * 2; // -1 to 1
      const yRatio = (e.clientY / innerHeight - 0.5) * 2;

      // Soft head tilt
      if (currentEmotion !== 'searching') {
        robotHead.style.transform = `rotate(${xRatio * 2.8}deg) translate(${xRatio * 3}px, ${yRatio * 2}px)`;
        // Eye tracking
        eyesContainer.style.transform = `translate(${xRatio * 8}px, ${yRatio * 5}px)`;
        // Floating front paws sway gently with perspective
        leftHand.style.transform = `translate(${xRatio * 5}px, ${yRatio * 3}px)`;
        rightHand.style.transform = `translate(${xRatio * 5}px, ${yRatio * 3}px)`;
      } else {
        // While in deadpan searching mode, gaze stays locked and concentrated
        eyesContainer.style.transform = `translate(0px, 0px)`;
      }
    });

    // ------------------------------------------------------------------
    // RANDOM EMOTIONS (idle behaviour)
    // ------------------------------------------------------------------
    const RANDOM_EMOTIONS = ['happy', 'wink', 'curious', 'love'];
    let lastRandomEmotion = null;
    let currentTaskText = '';
    let currentTaskLabel = '';
    let lastBridgeEvent = 0;
    let taskSafetyTimeout = null;

    function triggerRandomEmotion() {
      const choices = RANDOM_EMOTIONS.filter(e => e !== lastRandomEmotion);
      lastRandomEmotion = choices[Math.floor(Math.random() * choices.length)];
      triggerEmotion(lastRandomEmotion);
    }

    function scheduleRandomEmotion() {
      const delay = Math.random() * 6000 + 7000; // every 7-13 seconds
      setTimeout(() => {
        const busy =
          isListening ||
          isInteracting ||
          textMode ||
          activeReminders.length > 0 ||
          dueQueue.length > 0 ||
          currentEmotion === 'searching' ||
          (Date.now() - lastBridgeEvent) < 8000;
        if (!busy) triggerRandomEmotion();
        scheduleRandomEmotion();
      }, delay);
    }
    scheduleRandomEmotion();

    // ------------------------------------------------------------------
    // TASK ANIMATION (searching/typing look) - only while Python is working
    // ------------------------------------------------------------------
    function startTaskAnimation(label, hint) {
      currentTaskLabel = (label || 'WORKING...').toUpperCase();
      currentTaskText = hint || 'Working on it...';
      triggerEmotion('searching');

      // Safety net: never stay stuck in task mode forever
      clearTimeout(taskSafetyTimeout);
      taskSafetyTimeout = setTimeout(stopTaskAnimation, 45000);
    }

    function stopTaskAnimation() {
      clearTimeout(taskSafetyTimeout);
      if (currentEmotion === 'searching') {
        returnToCalm();
      }
      currentTaskText = '';
      currentTaskLabel = '';

      // Mic is still on: show the listening look again
      if (continuousListening && !isListening) {
        activateListeningVisuals();
      }
    }

    // Words in Python status text that mean "a task is running"
    const TASK_WORDS = ['search', 'open', 'find', 'launch', 'execut', 'process',
                        'work', 'look', 'download', 'creat', 'click', 'typing',
                        'play', 'fetch', 'check'];
    // Words that mean "task finished / nothing happening"
    const IDLE_WORDS = ['idle', 'ready', 'online', 'done', 'complete', 'finish',
                        'stopp', 'cancel', 'error', 'fail', 'not found'];

    function handleBridgeStatus(status) {
      lastBridgeEvent = Date.now();
      const text = String(status || '');
      const lower = text.toLowerCase();

      if (lower.includes('listening')) return; // mic animation is handled by the mic button

      // Python's listening loop has ended (after Stop, or after a mic error)
      if (lower.includes('online')) {
        continuousListening = false;
        deactivateListeningMode();
        stopTaskAnimation();
        if (currentEmotion === 'listening') returnToCalm();
        statusLabel.textContent = 'ONLINE';
        return;
      }

      if (IDLE_WORDS.some(w => lower.includes(w))) {
        stopTaskAnimation();
        statusLabel.textContent = 'ONLINE';
        return;
      }
      if (TASK_WORDS.some(w => lower.includes(w))) {
        startTaskAnimation(text, text);
        return;
      }
      statusLabel.textContent = text.toUpperCase();
    }

    function handleBridgeCommand(command) {
      lastBridgeEvent = Date.now();
      if (textMode) return;   // no robot animation in text mode
      startTaskAnimation('WORKING...', 'Working on: ' + command);
    }

    function handleBridgeResponse(response) {
      lastBridgeEvent = Date.now();
      if (textMode) { showTextReply(response); return; }
      stopTaskAnimation();
      hintIcon.textContent = '💬';
      hintText.textContent = response;
    }

    // Manual hooks (can also be called from Python via runJavaScript)

    window.stopTaskAnimation = stopTaskAnimation;

    // ------------------------------------------------------------------
    // FRAMELESS WINDOW: drag by the header, close with the X button
    // ------------------------------------------------------------------
    document.getElementById('app-header').addEventListener('mousedown', (e) => {
      if (e.button !== 0 || e.target.closest('#btn-close')) return;
      if (windowController) windowController.startMove();
    });

    function closeAssistantWindow(event) {
      if (event) event.stopPropagation();
      if (windowController) windowController.closeApp();
    }

    // Drag the whole window by pressing on the robot and moving the mouse.
    let dragStart = null;
    let dragMoved = false;

    interactiveZone.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || e.target.closest('#btn-mic') || e.target.closest('#btn-stop')) return;
      dragStart = { x: e.clientX, y: e.clientY };
      dragMoved = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragStart || !(e.buttons & 1)) { dragStart = null; return; }
      const dist = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
      if (dist > 6 && windowController) {
        dragMoved = true;
        dragStart = null;
        windowController.startMove();
      }
    });

    window.addEventListener('mouseup', () => { dragStart = null; });

    // ------------------------------------------------------------------
    // TEXT COMMAND MODE (double-click robot <-> search bar)
    // ------------------------------------------------------------------
    let textMode = false;
    const textPanel = document.getElementById('text-panel');
    const textInput = document.getElementById('text-input');
    const textReply = document.getElementById('text-reply');

    function showTextReply(message) {
      const text = String(message || '').trim();
      textReply.textContent = text;
      document.getElementById('text-reply-wrap').style.display = text ? 'block' : 'none';
      textReply.scrollTop = 0;
    }

    function setTextMode(on) {
      if (on === textMode) return;
      textMode = on;

      if (on) {
        // Leave voice mode: stop the microphone and any animation
        continuousListening = false;
        if (bridgeReady && assistantBridge) assistantBridge.stopListening();
        deactivateListeningMode();
        stopTaskAnimation();
        returnToCalm();
      }

      document.body.classList.toggle('text-mode', on);
      interactiveZone.style.display = on ? 'none' : '';
      textPanel.style.display = on ? 'flex' : 'none';

      // Make the window bigger for typing (or small again for the robot)
      if (windowController) windowController.setTextMode(on);
      applyNotesVisibility();   // the notes card is hidden in text mode

      if (on) {
        showTextReply('');
        setTimeout(() => textInput.focus(), 200);
      }
    }

    // Double-click the robot -> text mode (not when double-clicking Mic / Stop)
    interactiveZone.addEventListener('dblclick', (e) => {
      if (e.target.closest('#btn-mic') || e.target.closest('#btn-stop')) return;
      setTextMode(true);
    });

    // Double-click the search bar -> back to the robot
    textPanel.addEventListener('dblclick', () => setTextMode(false));

    // Enter sends the command, Escape goes back to the robot
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        setTextMode(false);
        return;
      }
      if (e.key !== 'Enter') return;

      const command = textInput.value.trim();
      if (!command) return;

      if (!bridgeReady || !assistantBridge) {
        showTextReply('Python connection unavailable.');
        return;
      }

      textInput.value = '';
      showTextReply('Working on it...');
      assistantBridge.submitTextCommand(command);
    });

    // Drag the window by the grip at the top of the search bar
    document.getElementById('text-grip').addEventListener('mousedown', (e) => {
      if (e.button === 0 && windowController) windowController.startMove();
    });

    // ------------------------------------------------------------------
    // REMINDERS: the robot face becomes a countdown timer
    // ------------------------------------------------------------------
    let activeReminders = [];   // from Python: [{id, name, total, ends_at_ms}]
    let dueQueue = [];          // names currently being announced

    const reminderOverlay  = document.getElementById('reminder-overlay');
    const reminderLabel    = document.getElementById('reminder-label');
    const reminderTime     = document.getElementById('reminder-time');
    const reminderNameEl   = document.getElementById('reminder-name');
    const reminderTrack    = document.getElementById('reminder-progress-track');
    const reminderProgress = document.getElementById('reminder-progress');
    const reminderMore     = document.getElementById('reminder-more');

    function capitalizeFirst(text) {
      return text ? text.charAt(0).toUpperCase() + text.slice(1) : text;
    }

    function formatClock(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
    }

    function updateReminderDisplay() {
      // Time is up: flash 00:00 and show the reminder name
      if (dueQueue.length) {
        reminderOverlay.style.display = 'flex';
        reminderLabel.textContent = "TIME'S UP";
        reminderTime.textContent = '00:00';
        reminderTime.classList.add('animate-pulse');
        reminderNameEl.textContent = capitalizeFirst(dueQueue[0]);
        reminderNameEl.classList.remove('truncate');
        reminderNameEl.style.whiteSpace = 'normal';
        reminderTrack.style.display = 'none';
        reminderMore.textContent = '';
        return;
      }

      if (!activeReminders.length) {
        reminderOverlay.style.display = 'none';
        return;
      }

      // Countdown for the reminder that finishes first
      const next = activeReminders.reduce((a, b) => (a.ends_at_ms <= b.ends_at_ms ? a : b));
      const remainingMs = Math.max(0, next.ends_at_ms - Date.now());
      const remainingSec = Math.ceil(remainingMs / 1000);

      reminderOverlay.style.display = 'flex';
      reminderLabel.textContent = 'REMINDER';
      reminderTime.textContent = formatClock(remainingSec);
      reminderTime.style.fontSize = remainingSec >= 3600 ? '40px' : '58px';
      reminderTime.classList.remove('animate-pulse');
      reminderNameEl.textContent = capitalizeFirst(next.name);
      reminderNameEl.classList.add('truncate');
      reminderNameEl.style.whiteSpace = '';
      reminderTrack.style.display = '';
      reminderProgress.style.width = (next.total > 0 ? (remainingMs / (next.total * 1000)) * 100 : 0) + '%';
      reminderMore.textContent = activeReminders.length > 1
        ? '+' + (activeReminders.length - 1) + ' more'
        : '';
    }

    let lastRemindersJson = null;

    function handleRemindersChanged(json) {
      if (json !== lastRemindersJson) {
        lastRemindersJson = json;
        console.log("Reminders updated:", json);
      }
      try {
        activeReminders = JSON.parse(json) || [];
      } catch (e) {
        activeReminders = [];
      }
      updateReminderDisplay();
    }

    function handleReminderDue(name) {
      lastBridgeEvent = Date.now();
      dueQueue.push(name);
      if (textMode) showTextReply('Reminder: ' + name);
      updateReminderDisplay();

      // Safety: never leave the alert on screen forever
      setTimeout(() => {
        const idx = dueQueue.indexOf(name);
        if (idx !== -1) {
          dueQueue.splice(idx, 1);
          updateReminderDisplay();
        }
      }, 40000);
    }

    function handleReminderDone(name) {
      const idx = dueQueue.indexOf(name);
      if (idx !== -1) dueQueue.splice(idx, 1);
      updateReminderDisplay();
    }

    setInterval(updateReminderDisplay, 250);

    // Backup: ask Python for the reminder list every second, in case a signal is missed.
    setInterval(() => {

      }

    function notesSection(label, live) {
      const el = document.createElement('div');

        const dot = document.createElement('span');
        dot.className = 'live';
        dot.textContent = ' \u2022 listening';
        el.appendChild(dot);
      }
      notesBody.appendChild(el);
    }

    function notesItems(points) {
      points.forEach((text, index) => {
        const row = document.createElement('div');
        row.className = 'note-item';
        const num = document.createElement('span');
        num.className = 'note-num';
        num.textContent = String(index + 1);
        const body = document.createElement('span');
        body.className = 'note-text';
        body.textContent = text;
        row.appendChild(num);
        row.appendChild(body);
        notesBody.appendChild(row);
      });
    }

    function renderNotesContent() {
      notesBody.textContent = '';
      const s = notesState;
      const hasDraft = s.active || s.draft.length > 0;

      if (hasDraft) {
        notesSection('New note', s.active);
        if (s.draft.length) notesItems(s.draft);
        else {
          const hint = document.createElement('div');
          hint.className = 'notes-empty';
          hint.textContent = 'Say your first point...';
          notesBody.appendChild(hint);
        }
        notesCount.textContent = s.draft.length + '/' + s.max;
      } else {
        notesCount.textContent = s.saved_total ? s.saved_total + ' saved' : '';
      }

      s.saved.forEach((sheet) => {
        notesSection('Saved \u00b7 ' + sheet.title, false);
        notesItems(sheet.points);
      });

      if (!hasDraft && !s.saved.length) {
        const empty = document.createElement('div');
        empty.className = 'notes-empty';
        empty.textContent = 'No notes yet. Say "sudo add a note".';
        notesBody.appendChild(empty);
      }

      notesBody.scrollTop = 0;
    }

    function applyNotesVisibility() {
      const show = (notesState.visible || todoState.visible) && !textMode;
      notesCard.style.display = show ? 'flex' : 'none';
      document.body.classList.toggle('notes-open', show);

      // Make the window wider (to the left) while the card is open
      if (windowController && show !== lastNotesShown) {
        lastNotesShown = show;
        windowController.setNotesCard(show);
      }
    }

    function handleNotesChanged(json) {
      if (json === lastNotesJson) return;
      lastNotesJson = json;
      console.log("Notes updated:", json);

      try {
        notesState = Object.assign(
          { visible: false, active: false, max: 10, draft: [], saved: [], saved_total: 0 },
          JSON.parse(json)
        );
      } catch (e) {
        return;
      }

      if (notesState.visible) cardSource = 'notes';
      renderCard();
      applyNotesVisibility();
    }

    // ----- To-do list (uses the same card on the left) -----
    let todoState = { visible: false, tasks: [], done: 0, total: 0 };
    let cardSource = 'notes';      // which list the card shows: 'notes' or 'todo'
    let lastTodoJson = null;
    const notesTitle = document.getElementById('notes-title');

    function showingTodo() {
      return todoState.visible && (cardSource === 'todo' || !notesState.visible);
    }

    function renderTodoContent() {
      notesBody.textContent = '';
      notesTitle.textContent = 'TO-DO';
      notesCount.textContent = todoState.total ? todoState.done + '/' + todoState.total + ' done' : '';

      todoState.tasks.forEach((task, index) => {
        const row = document.createElement('div');
        row.className = 'todo-item' + (task.done ? ' done' : '');
        const box = document.createElement('span');
        box.className = 'todo-box';
        box.textContent = '\u2713';
        const text = document.createElement('span');
        text.className = 'note-text';
        text.textContent = task.text;
        row.appendChild(box);
        row.appendChild(text);
        row.addEventListener('click', () => {
          if (bridgeReady && assistantBridge && assistantBridge.toggleTodo) assistantBridge.toggleTodo(index + 1);
        });
        notesBody.appendChild(row);
      });

      if (!todoState.tasks.length) {
        const empty = document.createElement('div');
        empty.className = 'notes-empty';
        empty.textContent = 'No tasks yet. Say "sudo add task buy milk".';
        notesBody.appendChild(empty);
      }
    }

    function renderCard() {
      if (showingTodo()) {
        renderTodoContent();
      } else {
        notesTitle.textContent = 'NOTES';
        renderNotesContent();
      }
    }

    function handleTodoChanged(json) {
      if (json === lastTodoJson) return;
      lastTodoJson = json;
      console.log("To-do updated:", json);

      try {
        todoState = Object.assign({ visible: false, tasks: [], done: 0, total: 0 }, JSON.parse(json));
      } catch (e) {
        return;
      }

      if (todoState.visible) cardSource = 'todo';
      renderCard();
      applyNotesVisibility();
    }

    function closeNotesCard() {
      if (showingTodo()) {
        todoState.visible = false;
        applyNotesVisibility();
        renderCard();
        if (bridgeReady && assistantBridge && assistantBridge.closeTodo) assistantBridge.closeTodo();
        return;
      }

      notesState.visible = false;
      applyNotesVisibility();
      if (bridgeReady && assistantBridge && assistantBridge.closeNotes) assistantBridge.closeNotes();
    }

    // Backup: ask Python for the to-do list every second, in case a signal is missed.
    setInterval(() => {
      if (bridgeReady && assistantBridge && typeof assistantBridge.getTodo === 'function') {
        assistantBridge.getTodo(function(json) { handleTodoChanged(json); });
      }
    }, 1000);

    // Backup: ask Python for the notes every second, in case a signal is missed.
    setInterval(() => {
      if (bridgeReady && assistantBridge && typeof assistantBridge.getNotes === 'function') {
        assistantBridge.getNotes(function(json) { handleNotesChanged(json); });
      }
    }, 1000);

    console.log("code.html loaded: todo-v1");
  </script>
</body></html>
